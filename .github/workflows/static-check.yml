name: static-check

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "checking $file"
            node --check "$file"
          done < <(find js -name '*.js' -print0)
          node --check server.mjs

      - name: Check required static files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f assets/map/base-map.jpg
          test -f assets/character/hero.png
          test -f assets/covers/zijincheng.jpg
          test -f assets/covers/yongdingmen.jpg
          test -f js/data/pois.js
          echo "static files OK"

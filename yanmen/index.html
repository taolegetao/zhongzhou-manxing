<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#efe6d2">
<title>验门 · 正阳门</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23efe6d2'/><rect x='6' y='10' width='20' height='16' fill='%23a8402c'/><rect x='13' y='17' width='6' height='9' fill='%2314101a'/></svg>">
<style>
  :root{
    --paper:#efe6d2;
    --paper-2:#f8f1e2;
    --ink:#241c26;
    --ink-2:#5a4e58;
    --zhu:#a8402c;
    --zhu-lt:#c4553a;
    --jade:#2f4a3c;
    --gold:#b8893a;
    --ok:#3f7a55;
    --bad:#a8332c;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;background:#e6dcc6;}
  body{
    font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    user-select:none;-webkit-user-select:none;
  }
  #app{
    position:fixed;inset:0;
    display:flex;flex-direction:column;
    background-color:#efe6d2;
    background-size:100% auto;
    background-position:center top;
    background-repeat:no-repeat;
    transition:background-image .4s;
  }
  /* 纸色罩层：上半露城门，下半渐隐成纸，保证文字可读 */
  #app::before{
    content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
    background:linear-gradient(180deg,
      rgba(246,240,226,.62) 0%,
      rgba(246,240,226,.18) 10%,
      rgba(246,240,226,0)   20%,
      rgba(246,240,226,0)   50%,
      rgba(246,240,226,.55) 60%,
      #efe6d2 70%,
      #efe6d2 100%);
  }
  #app > *{position:relative;z-index:1;}

  /* ---------- 顶栏 ---------- */
  .top{
    flex:0 0 auto;
    padding:max(12px,env(safe-area-inset-top)) 16px 10px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .top .name{font-size:13px;letter-spacing:.28em;color:var(--ink-2);}
  .top .count{font-size:12px;letter-spacing:.12em;color:var(--ink-2);opacity:.75;}
  .stars{display:flex;gap:5px;}
  .star{
    width:15px;height:15px;display:block;object-fit:contain;
    transition:opacity .3s, transform .3s;
  }
  .star.off{opacity:.85;transform:scale(.9);}

  /* ---------- 规则 ---------- */
  .rules{
    flex:0 0 auto;
    margin:0 40px 8px;
    padding:9px 14px;
    border:1px solid rgba(36,28,38,.14);
    border-radius:10px;
    background:rgba(255,252,245,.62);
    backdrop-filter:blur(7px);
    -webkit-backdrop-filter:blur(7px);
    box-shadow:0 4px 14px rgba(90,60,30,.07);
    font-size:12px;line-height:1.8;color:var(--ink-2);
    text-align:center;
  }
  .rules b{color:var(--zhu);font-weight:400;}
  .rules .hint{font-size:11px;color:rgba(90,78,88,.65);letter-spacing:.06em;}

  /* ---------- 人物 ---------- */
  .stage{
    flex:1 1 auto;min-height:0;
    padding-top:4px;
    display:flex;flex-direction:column;align-items:center;
    padding:0 16px;
  }
  .portrait{
    flex:1 1 auto;min-height:0;
    display:flex;align-items:flex-end;justify-content:center;
    width:100%;
  }
  .portrait{position:relative;}
  .portrait img{
    position:absolute;inset:0;margin:auto;
    max-height:104%;max-width:100%;
    width:auto;height:auto;
    object-fit:contain;display:block;
    filter:drop-shadow(0 12px 16px rgba(60,38,20,.20));
    animation:rise .38s ease both;
  }
  @keyframes rise{
    from{opacity:0;transform:translateY(12px) scale(.985);}
    to{opacity:1;transform:none;}
  }
  .info{
    flex:0 0 auto;width:100%;max-width:420px;
    margin-top:6px;
    border-top:1px solid rgba(36,28,38,.14);
    padding-top:10px;
  }
  .row{
    display:flex;gap:10px;align-items:baseline;
    padding:4px 0;
    font-size:13.5px;line-height:1.6;
  }
  .row .k{
    flex:0 0 26px;
    color:var(--zhu);
    font-size:12px;
    letter-spacing:.1em;
  }
  .row .v{color:var(--ink);flex:1 1 auto;}
  .row .v em{font-style:normal;color:var(--zhu);font-weight:400;}

  /* ---------- 按钮 ---------- */
  .actions{
    flex:0 0 auto;
    padding:12px 14px calc(14px + env(safe-area-inset-bottom));
    display:grid;grid-template-columns:1fr 1fr;gap:9px;
  }
  .act{
    font-family:inherit;font-size:15px;letter-spacing:.2em;text-indent:.2em;
    padding:15px 0;border-radius:10px;cursor:pointer;
    border:1px solid rgba(168,64,44,.35);
    background:rgba(255,251,242,.85);
    color:var(--ink);
    transition:transform .1s, background .18s;
  }
  .act:active{transform:scale(.97);}
  .act.left{border-color:rgba(47,74,60,.4);}
  .act.right{border-color:rgba(47,74,60,.4);}
  .act.center{
    border-color:rgba(184,137,58,.6);
    color:#8a6a22;
    background:linear-gradient(180deg,#fdf3d8,#f6e7bd);
  }
  .act.stop{
    border-color:rgba(168,51,44,.45);
    color:var(--bad);
  }

  /* ---------- 反馈层 ---------- */
  .feed{
    position:fixed;inset:0;z-index:20;
    display:none;flex-direction:column;align-items:center;justify-content:center;
    padding:28px;text-align:center;
    background:rgba(246,240,226,.94);
    animation:pop .22s ease both;
  }
  .feed.on{display:flex;}
  @keyframes pop{from{opacity:0;transform:scale(.97);}to{opacity:1;transform:none;}}
  .feed .mark{
    width:64px;height:64px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:30px;color:#fff;
    margin-bottom:18px;
  }
  .feed.good .mark{background:var(--ok);}
  .feed.bad .mark{background:var(--bad);}
  .feed h2{
    font-weight:400;font-size:22px;letter-spacing:.16em;
    margin-bottom:12px;
  }
  .feed.good h2{color:var(--ok);}
  .feed.bad h2{color:var(--bad);}
  .feed p{
    font-size:14px;line-height:2;color:var(--ink-2);
    max-width:20em;
  }
  .feed button{
    margin-top:26px;
    font-family:inherit;font-size:15px;letter-spacing:.3em;text-indent:.3em;
    padding:13px 40px;border-radius:999px;cursor:pointer;
    border:none;color:#fdf7ea;background:var(--zhu);
  }

  /* ---------- 结算 ---------- */
  .end{
    position:fixed;inset:0;z-index:30;
    display:none;flex-direction:column;align-items:center;justify-content:center;
    padding:30px;text-align:center;
    background:rgba(246,240,226,.97);
  }
  .end.on{display:flex;}
  .endseal{width:86px;height:86px;margin-bottom:14px;opacity:.92;
    filter:drop-shadow(0 4px 10px rgba(120,60,40,.18));}
  .end .bigstars{display:flex;gap:12px;margin-bottom:22px;}
  .end .bigstars .star{width:34px;height:34px;}
  .end h1{
    font-weight:400;font-size:26px;letter-spacing:.2em;color:var(--ink);
  }
  .end p{
    margin-top:16px;font-size:14px;line-height:2;color:var(--ink-2);max-width:20em;
  }
  .end .score{margin-top:20px;font-size:13px;color:var(--gold);letter-spacing:.16em;}
  .end button{
    margin-top:30px;
    font-family:inherit;font-size:15px;letter-spacing:.3em;text-indent:.3em;
    padding:13px 40px;border-radius:999px;cursor:pointer;border:none;
    color:#fdf7ea;background:var(--zhu);
  }

  /* ---------- 顶栏右侧 ---------- */
  .topright{display:flex;align-items:center;gap:9px;}
  .notice-btn{
    width:26px;height:26px;border-radius:7px;cursor:pointer;
    font-family:inherit;font-size:12px;line-height:1;
    color:#f3ead6;background:linear-gradient(180deg,#9a6b3e,#7d5229);
    border:1px solid rgba(90,58,30,.5);
    box-shadow:0 2px 6px rgba(80,50,25,.22);
  }
  .notice-btn:active{transform:scale(.94);}

  /* ---------- 今日告示 ---------- */
  .notice{
    position:fixed;inset:0;z-index:40;
    display:flex;align-items:center;justify-content:center;
    background:rgba(24,18,26,.52);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    animation:fadein .22s ease both;
  }
  .notice[hidden]{display:none;}
  @keyframes fadein{from{opacity:0}to{opacity:1}}

  .board{
    position:relative;
    height:min(70vh,600px);
    aspect-ratio:126 / 249;
    animation:boardin .34s cubic-bezier(.2,.9,.3,1) both;
    filter:drop-shadow(0 22px 40px rgba(20,12,6,.42));
  }
  @keyframes boardin{
    from{opacity:0;transform:translateY(16px) scale(.94);}
    to{opacity:1;transform:none;}
  }
  .board-img{width:100%;height:100%;display:block;object-fit:contain;}

  .board-paper{
    position:absolute;
    left:8%;right:8%;top:6.5%;bottom:7.5%;
    display:flex;flex-direction:column;
    justify-content:center;
    padding:7% 7%;
    background:linear-gradient(180deg,#f7f0dd,#efe4ca);
    border-radius:2px;
    box-shadow:inset 0 0 0 1px rgba(120,90,50,.22),
               inset 0 0 22px rgba(150,110,60,.13),
               0 2px 6px rgba(60,40,20,.25);
    overflow:hidden;
  }
  .np-kicker{
    font-size:clamp(9px,2.2vh,11px);letter-spacing:.34em;text-indent:.34em;
    color:#a8402c;text-align:center;
  }
  .np-title{
    font-weight:400;
    font-size:clamp(14px,3.4vh,18px);
    letter-spacing:.1em;text-align:center;
    margin:.5em 0 .7em;
    color:#3a2a1c;
  }
  .np-rules{
    list-style:none;flex:0 0 auto;
    display:flex;flex-direction:column;gap:.85em;
    margin:.2em 0 -.2em;
  }
  .np-rules li{
    display:flex;gap:.45em;align-items:flex-start;
    font-size:clamp(12px,3.0vh,16px);line-height:1.6;color:#3f3226;
  }
  .np-rules b{
    flex:0 0 1.3em;
    font-weight:400;color:#a8402c;
    font-size:1em;line-height:1.6;
  }
  .np-rules em{font-style:normal;color:#a8402c;}
  .np-hint{
    font-size:clamp(9px,2.2vh,11.5px);
    color:#8d7a5e;letter-spacing:.04em;
    text-align:center;margin-top:1.1em;
    border-top:1px dashed rgba(140,110,70,.35);padding-top:.7em;
  }
  .np-bar{
    height:3px;border-radius:2px;overflow:hidden;
    background:rgba(140,110,70,.22);
    margin:1.1em 0 .55em;
  }
  .np-bar i{
    display:block;height:100%;width:0;
    background:linear-gradient(90deg,#b04a34,#c4642f);
    border-radius:2px;
    transition:width .18s ease;
  }
  .np-ok[disabled]{
    opacity:.62;cursor:default;
    background:linear-gradient(180deg,#9a8f7e,#867a69);
    box-shadow:none;font-size:clamp(10px,2.6vh,12.5px);letter-spacing:.12em;text-indent:.12em;
  }
  .np-ok{
    margin-top:.2em;
    font-family:inherit;
    font-size:clamp(12px,3.1vh,15px);
    letter-spacing:.3em;text-indent:.3em;
    padding:.62em 0;border-radius:999px;cursor:pointer;border:none;
    color:#fdf7ea;background:linear-gradient(180deg,#b04a34,#983827);
    box-shadow:0 4px 12px rgba(150,60,35,.32);
  }
  .np-ok:active{transform:scale(.98);}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <span class="name">正 阳 门</span>
    <span class="count" id="count">第 1 / 12 人</span>
    <div class="topright">
      <button id="noticeBtn" class="notice-btn" type="button" aria-label="查看今日告示">告</button>
      <div class="stars" id="stars"></div>
    </div>
  </div>


  <div class="stage">
    <div class="portrait" id="portrait"></div>
    <div class="info" id="info"></div>
  </div>

  <div class="actions">
    <button class="act left"  data-a="left">左 门</button>
    <button class="act right" data-a="right">右 门</button>
    <button class="act center" data-a="center">中 门</button>
    <button class="act stop"  data-a="stop">拦 下</button>
  </div>
</div>

<div class="feed" id="feed">
  <div class="mark" id="feedMark">✓</div>
  <h2 id="feedTitle">对！</h2>
  <p id="feedText"></p>
  <button id="feedNext">下 一 位</button>
</div>

<div class="end" id="end">
  <img class="endseal" src="./assets/ui/ui-seal.webp" alt="">
  <div class="bigstars" id="endStars"></div>
  <h1 id="endTitle">好眼力！</h1>
  <p id="endText"></p>
  <div class="score" id="endScore"></div>
  <button id="again">再 来 一 次</button>
</div>

<div class="notice" id="notice" hidden>
  <div class="board" id="board">
    <img class="board-img" src="./assets/ui/ui-notice.webp" alt="">
    <div class="board-paper">
      <p class="np-kicker">今日告示</p>
      <h2 class="np-title">正阳门 · 验门三条</h2>
      <ol class="np-rules">
        <li><b>一</b><span>中门只给<em>皇帝</em>走</span></li>
        <li><b>二</b><span>进城<em>左门</em>，出城<em>右门</em></span></li>
        <li><b>三</b><span>没有<em>凭证</em>不许进</span></li>
      </ol>
      <p class="np-hint">凭证：牙牌 · 路引 · 火牌 · 度牒</p>
      <div class="np-bar"><i id="npBar"></i></div>
      <button id="noticeOk" class="np-ok" type="button">知 道 了</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ================= 人物外观（占位图，图到位后换 img） ================= */
  const LOOK = {
    official:  { robe:'#2f5f7a', hat:'wusha', patch:{dx:0,  dy:0},   prop:'plaque', skin:'#f0d9c4' },
    official2: { robe:'#35688a', hat:'wusha', patch:{dx:0,  dy:0},   prop:'plaque', skin:'#e8cdb4' },
    official3: { robe:'#2b5870', hat:'wusha', patch:{dx:0,  dy:0},   prop:'plaque', skin:'#f2ddc8' },
    fake:      { robe:'#2f5f7a', hat:'wusha', patch:{dx:-13, dy:17}, prop:'plaque', skin:'#eed6c0', shift:true },
    merchant:  { robe:'#8a6a3a', hat:'cap',   patch:null,            prop:'luyin',  skin:'#f0d9c4' },
    monk:      { robe:'#8a8678', hat:'none',  patch:null,            prop:'dudie',  skin:'#edd6bf' },
    porter:    { robe:'#7a6a58', hat:'none',  patch:null,            prop:'pole',   skin:'#e0c2a4' },
    porter2:   { robe:'#6f6050', hat:'none',  patch:null,            prop:null,     skin:'#dcbc9c' },
    courier:   { robe:'#5d5347', hat:'none',  patch:null,            prop:'huopai', skin:'#e5c8a8' },
    spy:       { robe:'#6b6459', hat:'none',  patch:null,            prop:'luyin',  skin:'#f0dccb', clean:true },
    emperor:   { robe:'#d8a63a', hat:'crown', patch:null,            prop:null,     skin:'#f5e0cb' },
    /* ---- 女性 ---- */
    flowergirl:{ robe:'#7d8a5c', hat:'none',  patch:null,            prop:'basket', skin:'#f3ddc6',
                 sex:'f', flower:true },
    nun:       { robe:'#8a8678', hat:'none',  patch:null,            prop:'dudie',  skin:'#edd6bf',
                 sex:'f', nun:true },
    disguise:  { robe:'#6a6152', hat:'cap',   patch:null,            prop:'luyin',  skin:'#eed6c0',
                 ear:true, bun:true }
  };

  function portraitSvg(key) {
    const k = key === 'official3' ? 'official2' : key;
    return `<img src="./assets/person_cut/p-${k}.webp" alt="" draggable="false">`;
  }

  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    const r = Math.max(0, Math.min(255, (n >> 16) + amt));
    const g = Math.max(0, Math.min(255, ((n >> 8) & 255) + amt));
    const b = Math.max(0, Math.min(255, (n & 255) + amt));
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }

  /* ================= 十二个人 ================= */
  const PEOPLE = [
    {
      look:'official', cloth:'青色鹭鸶补服，补子端正', item:'牙牌「礼部主事」',
      say:'五鼓入朝，迟了要误班。', time:'进城', answer:'left',
      ok:'对！他有牙牌，进城走左门。',
      no:'不对。他是持牙牌的京官，进城该走左门。'
    },
    {
      look:'merchant', cloth:'绸缎长袍', item:'路引一张',
      say:'货已卖完，出城回家。', time:'出城', answer:'right',
      ok:'对！出城走右门。',
      no:'不对。他有路引，又是出城，该走右门。'
    },
    {
      look:'porter', cloth:'短褐，肩上扁担', item:'两手空空',
      say:'官爷，我送菜进城的。', time:'进城', answer:'stop',
      ok:'对！他没有凭证，只能拦下。',
      no:'不对。他什么凭证也没有，按规矩不许进。'
    },
    {
      look:'monk', cloth:'灰布僧衣，没有帽子', item:'度牒',
      say:'贫僧进城挂单。', time:'进城', answer:'left',
      ok:'对！度牒也是凭证，进城走左门。',
      no:'不对。度牒是凭证，进城该走左门。'
    },
    {
      look:'flowergirl', cloth:'青布衫裙，鬓边别一朵白兰', item:'一只花篮，没有凭证',
      say:'官爷，卖完这一篮就回。', time:'进城', answer:'stop',
      ok:'对。没有凭证就是不能进——哪怕她只是卖花的。',
      no:'不对。她手里只有花篮，没有凭证。规矩对谁都一样。'
    },
    {
      look:'fake', cloth:'青色官袍，补子缝在胸口偏下', item:'牙牌，字迹模糊',
      say:'下官……下官是鸿胪寺的。', time:'进城', answer:'stop',
      ok:'对！补子缝歪了，是借来的官服。',
      no:'不对。你看他的补子——缝在胸口偏下。真官服不会这样。'
    },
    {
      look:'courier', cloth:'短打绑腿，风尘仆仆', item:'火牌，朱批「加急」',
      say:'边关急报！让开！', time:'进城', answer:'left',
      ok:'对！火牌是急务凭证，走左门。',
      no:'不对。他有火牌，是急务，该走左门。'
    },
    {
      look:'disguise', cloth:'男子直裰与巾帽，可耳垂上有耳钉，鬓角露出女子发髻',
      item:'路引一张，写着「张大牛」',
      say:'（声音有些细）……进城寻亲。', time:'进城', answer:'stop',
      ok:'对。路引上写的是「张大牛」，可她是女子——凭证不是她本人的。',
      no:'不对。路引上写的是「张大牛」，一个男人。人对不上。'
    },
    {
      look:'spy', cloth:'寻常布衣，神色过于镇定', item:'路引，印章颜色太新',
      say:'探亲的。', time:'进城', answer:'stop',
      ok:'对！路引的印章太新了，是伪造的。',
      no:'不对。你看他的路引——印章的颜色新得反常，是假的。'
    },
    {
      look:'nun', cloth:'灰布僧衣，剃了发', item:'度牒',
      say:'进城挂单，住三日便走。', time:'进城', answer:'left',
      ok:'对。度牒是凭证，进城走左门。',
      no:'不对。她有度牒，进城该走左门。'
    },
    {
      look:'emperor', cloth:'明黄龙袍，身后有华盖', item:'不必有',
      say:'（仪仗已到，前面的人跪了一地）', time:'进城', answer:'center',
      ok:'对！中门只给皇帝走。这是今天唯一该开中门的一次。',
      no:'不对。你想想规则第一条——中门只给谁走？'
    },
    {
      look:'official2', cloth:'青色补服，补子端正', item:'牙牌「大理寺评事」',
      say:'奉命出城查案。', time:'出城', answer:'right',
      ok:'对！出城一律走右门，官员也不例外。',
      no:'不对。他是官员，可他要出城——出城一律走右门。看的是「时」，不是「他是谁」。'
    }
  ];

  const LABEL = { left:'左门', right:'右门', center:'中门', stop:'拦下' };

  /* ================= 状态 ================= */
  const S = { i: 0, stars: 3, wrong: 0, locked: false };

  const el = {
    count: document.getElementById('count'),
    stars: document.getElementById('stars'),
    portrait: document.getElementById('portrait'),
    info: document.getElementById('info'),
    feed: document.getElementById('feed'),
    feedMark: document.getElementById('feedMark'),
    feedTitle: document.getElementById('feedTitle'),
    feedText: document.getElementById('feedText'),
    end: document.getElementById('end'),
    endStars: document.getElementById('endStars'),
    endTitle: document.getElementById('endTitle'),
    endText: document.getElementById('endText'),
    endScore: document.getElementById('endScore')
  };

  function renderStars(container, n) {
    container.innerHTML = '';
    for (let k = 0; k < 3; k++) {
      const im = document.createElement('img');
      im.className = 'star' + (k < n ? '' : ' off');
      im.src = k < n
        ? './assets/ui/ui-star-bright.png'
        : './assets/ui/ui-star-dim.png';
      im.alt = '';
      im.draggable = false;
      container.appendChild(im);
    }
  }

  function renderPerson() {
    const p = PEOPLE[S.i];
    S.locked = false;
    el.count.textContent = `第 ${S.i + 1} / ${PEOPLE.length} 人`;
    el.portrait.innerHTML = portraitSvg(p.look);

    const rows = [
      ['衣', p.cloth],
      ['物', p.item],
      ['言', `「${p.say}」`],
      ['时', p.time]
    ];
    el.info.innerHTML = rows.map(([k, v]) =>
      `<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`
    ).join('');
  }

  function judge(action) {
    if (S.locked) return;
    const p = PEOPLE[S.i];
    const right = action === p.answer;
    S.locked = true;

    if (right) {
      showFeed(true, '对！', p.ok);
    } else {
      S.wrong++;
      S.stars = Math.max(0, 3 - S.wrong);
      renderStars(el.stars, S.stars);
      showFeed(false, `该走「${LABEL[p.answer]}」`, p.no);
    }
  }

  function showFeed(good, title, text) {
    el.feed.className = 'feed on ' + (good ? 'good' : 'bad');
    el.feedMark.textContent = good ? '✓' : '✕';
    el.feedTitle.textContent = title;
    el.feedText.textContent = text;
  }

  function next() {
    el.feed.className = 'feed';
    S.i++;
    if (S.i >= PEOPLE.length) {
      finish();
    } else {
      renderPerson();
    }
  }

  function finish() {
    renderStars(el.endStars, S.stars);
    const t = [
      ['好眼力！', '十二个人，一个没看错。正阳门交给你，一夜无事。'],
      ['看得出来。', '只走神了一次。凭证和衣裳都会说话，再看仔细些。'],
      ['还行。', '错了两回。记住：看凭证，也看衣裳穿得对不对。'],
      ['没关系。', '门吏也是练出来的。再来一次，这次慢慢看。']
    ][S.wrong >= 3 ? 3 : S.wrong];
    el.endTitle.textContent = t[0];
    el.endText.textContent = t[1];
    el.endScore.textContent = `错了 ${S.wrong} 次`;
    el.end.classList.add('on');
  }

  const SKIES = ['bg-day', 'bg-dusk', 'bg-night'];

  const PORTRAITS = [
    'official', 'official2', 'fake', 'merchant',
    'monk', 'porter', 'courier', 'spy',
    'emperor', 'flowergirl', 'disguise', 'nun'
  ];

  const npBtn = document.getElementById('noticeOk');
  const npBar = document.getElementById('npBar');
  let assetsReady = false;

  function rollSky() {
    const pick = SKIES[Math.floor(Math.random() * SKIES.length)];
    document.getElementById('app').style.backgroundImage =
      `url("./assets/scene/${pick}.jpg")`;
    return pick;
  }

  /** 把本局要用到的图全部拉进缓存，避免换人时卡顿。 */
  function preloadAll(sky) {
    const urls = PORTRAITS.map((k) => `./assets/person_cut/p-${k}.webp`);
    urls.push(`./assets/scene/${sky}.jpg`);

    let done = 0;
    const total = urls.length;
    assetsReady = false;
    npBtn.disabled = true;
    npBtn.textContent = `正在备图 0 / ${total}`;
    npBar.style.width = '0%';

    const tick = () => {
      done += 1;
      const pct = Math.round((done / total) * 100);
      npBar.style.width = pct + '%';
      npBtn.textContent = `正在备图 ${done} / ${total}`;
      if (done >= total) {
        assetsReady = true;
        npBtn.disabled = false;
        npBtn.textContent = '知 道 了';
        npBar.parentElement.style.opacity = '0';
      }
    };

    urls.forEach((u) => {
      const img = new Image();
      img.onload = tick;
      img.onerror = tick;
      img.src = u;
    });
  }

  const notice = document.getElementById('notice');

  function showNotice() {
    notice.hidden = false;
  }
  function hideNotice() {
    notice.hidden = true;
  }

  function reset() {
    S.i = 0; S.stars = 3; S.wrong = 0; S.locked = false;
    const sky = rollSky();
    showNotice();
    preloadAll(sky);
    renderStars(el.stars, 3);
    el.end.classList.remove('on');
    el.feed.className = 'feed';
    renderPerson();
  }

  document.querySelectorAll('.act').forEach((b) => {
    b.addEventListener('click', () => judge(b.dataset.a));
  });
  document.getElementById('feedNext').addEventListener('click', next);
  document.getElementById('again').addEventListener('click', reset);
  npBtn.addEventListener('click', () => { if (assetsReady) hideNotice(); });
  document.getElementById('noticeBtn').addEventListener('click', showNotice);
  notice.addEventListener('click', (e) => { if (e.target === notice && assetsReady) hideNotice(); });

  window.addEventListener('keydown', (e) => {
    if (!notice.hidden) {
      if (assetsReady && (e.code === 'Space' || e.code === 'Enter' || e.code === 'Escape')) {
        e.preventDefault(); hideNotice();
      }
      return;
    }
    if (el.feed.classList.contains('on')) {
      if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); next(); }
      return;
    }
    const map = { Digit1:'left', Digit2:'right', Digit3:'center', Digit4:'stop' };
    if (map[e.code]) judge(map[e.code]);
  });

  reset();
})();
</script>
